    const gx=px+16,gy=py+TS-h*.4,r=46+Math.sin(tAnim*4)*4,gl=ctx.createRadialGradient(gx,gy,2,gx,gy,r);gl.addColorStop(0,'rgba(255,215,120,.5)');gl.addColorStop(1,'rgba(255,170,60,0)');ctx.fillStyle=gl;ctx.fillRect(gx-r,gy-r,r*2,r*2);
    ctx.drawImage(ATL,s.x,s.y,s.w,s.h,px+16-w/2,py+TS-h+2,w,h);return true}
  if(c==='T'){const s=ATLAS.torch,w=16,h=s.h/s.w*w,f=Math.sin(tAnim*13+x*3);
    ctx.drawImage(ATL,s.x,s.y,s.w,s.h,px+16-w/2,py-14,w,h);
    ctx.save();ctx.globalCompositeOperation='lighter';const gx=px+16,gy=py-6,r=15+f*2,g=ctx.createRadialGradient(gx,gy,0,gx,gy,r);g.addColorStop(0,'rgba(255,170,60,.38)');g.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=g;ctx.fillRect(gx-r,gy-r,r*2,r*2);ctx.restore();return true}
  return false}


function solid(tx,ty){if(tx<0||tx>=W)return true;if(ty<0)return true;if(ty>=H)return false;const c=G[ty][tx];return c==='#'||c==='L'||(c==='G'&&!gateOpen)}
function ent(x,y,hp){return{x:x*TS+7,y:y*TS-8,w:18,h:40,vx:0,vy:0,dir:1,ground:false,hp:hp,maxhp:hp,atk:0,atkHit:false,blk:0,stun:0,hurt:0,cd:0.8,dead:false,peak:y*TS,hang:false,climb:0,grabCd:0}}
function loadLevel(n){
  const L=LEVELS[n];CUR=L;G=L.build();timeLeft=L.time*[1.7,1,.8][DIFF];H=G.length;W=G[0].length;gateOpen=false;gateA=0;loose={};debris=[];parts=[];shake=0;fade=1;
  P=ent(L.start[0],L.start[1],3);P.hp=DF[DIFF].hp;P.maxhp=DF[DIFF].hp;
  guards=L.guards.map(a=>{const g=ent(a[0],a[1],a[2]);g.dir=-1;return g});
  lights=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=G[y][x];if(c==='T')lights.push({x:x*TS+16,y:y*TS-4,r:150,a:.95,t:'torch'});if(c==='E')lights.push({x:x*TS+16,y:y*TS-8,r:130,a:.9,t:'door'})}
  cam.x=Math.max(0,P.x-VW/2);cam.y=Math.max(0,Math.min(H*TS-VH,P.y-VH*.6));
  state='play';msg='';
}
function startOrRestart(){
  if(state==='title'){state='menu';fade=1}
  else if(state==='end'){state='menu';fade=1}
  else if(state==='time'||state==='dead'){loadLevel(lvl)}
  else if(state==='win'){openStory(lvl+1)}
  else if(state==='story'){advanceStory()}
  else if(state==='menu'){openStory(sel)}
}
function openStory(i){story={i:i,page:0,t:0};state='story';fade=1}
function advanceStory(){
  const pages=STORY[story.i],pg=pages[story.page];
  const total=pg.l.reduce((a,b)=>a+b.length,0);
  if(story.t*40<total){story.t=999;return}
  story.page++;story.t=0;
  if(story.page>=pages.length){
    if(story.i>=LEVELS.length){state='end';fade=1}
    else{lvl=story.i;loadLevel(story.i)}
  }
}
function markDone(){DONE[lvl]=1;try{localStorage.setItem('dp_done',JSON.stringify(DONE))}catch(e){}}
try{DONE=JSON.parse(localStorage.getItem('dp_done')||'{}')||{}}catch(e){DONE={}}

/* ---------- particles ---------- */
function dust(x,y,n,col){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*10,y:y,vx:(Math.random()-.5)*60,vy:-Math.random()*30,life:.5,max:.5,s:2+Math.random()*3,col:col||'200,180,140',g:-20,k:'dust'})}
function sparks(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*140;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.35,max:.35,s:1.5,col:'255,230,150',g:400,k:'spark'})}}
function ember(x,y){parts.push({x:x+(Math.random()-.5)*6,y:y,vx:(Math.random()-.5)*14,vy:-20-Math.random()*20,life:1.2,max:1.2,s:1.4,col:'255,160,60',g:-6,k:'spark'})}

/* ---------- physics ---------- */
function moveX(e,dx){e.x+=dx;const t0=Math.floor(e.y/TS),t1=Math.floor((e.y+e.h-1)/TS);
  if(dx>0){const tx=Math.floor((e.x+e.w)/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=tx*TS-e.w-0.01;e.vx=0;return}}
  else if(dx<0){const tx=Math.floor(e.x/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=(tx+1)*TS+0.01;e.vx=0;return}}}
function moveY(e,dy){e.y+=dy;const t0=Math.floor(e.x/TS),t1=Math.floor((e.x+e.w-1)/TS);
  if(dy>0){const ty=Math.floor((e.y+e.h)/TS);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=ty*TS-e.h-0.01;e.vy=0;e.ground=true;return}}
  else if(dy<0){const ty=Math.floor(e.y/TS);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=(ty+1)*TS+0.01;e.vy=0;return}}}

function die(why){if(P.dead)return;P.dead=true;P.hp=0;msg=why;state='dead';shake=8;snd(120,.6,'sawtooth',.08)}
function hurtPlayer(n,fromDir){if(P.hurt>0||P.dead)return;P.hp-=n;P.hurt=.7;P.vx=fromDir*200;P.vy=-150;P.hang=false;P.atk=0;shake=6;sparks(P.x+9,P.y+16,6);snd(180,.2,'sawtooth');if(P.hp<=0)die('הנסיך נפל בקרב')}

function tryGrab(p){
  const hx=p.x+(p.dir>0?p.w+3:-3),hy=p.y+4,tx=Math.floor(hx/TS),ty=Math.floor(hy/TS);
  if(solid(tx,ty)&&!solid(tx,ty-1)&&(hy-ty*TS)<14){
    p.hang=true;p.vx=p.vy=0;p.gx=tx;p.gy=ty;
    p.x=p.dir>0?tx*TS-p.w-1:(tx+1)*TS+1;p.y=ty*TS+2;
  }
}
function canClimb(p){return !solid(p.gx,p.gy-1)&&!solid(p.gx,p.gy-2)}
function climbTarget(p){return{x:p.dir>0?p.gx*TS+3:(p.gx+1)*TS-p.w-3,y:p.gy*TS-p.h-0.01}}
function finishClimb(p){const t=climbTarget(p);p.x=t.x;p.y=t.y;p.hang=false;p.vy=0;p.peak=p.y;p.grabCd=.2}

function updPlayer(dt){
  const p=P;if(p.dead)return;
  p.hurt=Math.max(0,p.hurt-dt);p.grabCd=Math.max(0,p.grabCd-dt);
  if(p.climb>0){p.climb-=dt;if(p.climb<=0){p.climb=0;finishClimb(p)}return}
  if(p.hang){
    if(keys.down){p.hang=false;p.grabCd=.35;p.vy=0}
    else if((keys.up||pressed.up)&&canClimb(p))p.climb=.35;
    pressed.up=false;return}
  p.blk=(keys.blk&&p.ground&&p.atk<=0)?1:0;
  let ax=0;if(keys.left)ax-=1;if(keys.right)ax+=1;
  const sp=(p.blk||p.atk>0)?35:(p.ground?160:DF[DIFF].sp);
  if(p.hurt<.4){p.vx+=((ax*sp)-p.vx)*Math.min(1,(p.ground?14:8)*dt);if(ax&&!p.blk&&p.atk<=0)p.dir=ax}
  if(pressed.up)p.jbuf=DF[DIFF].buf;pressed.up=false;
  p.jbuf=Math.max(0,(p.jbuf||0)-dt);p.coy=p.ground?DF[DIFF].coy:Math.max(0,(p.coy||0)-dt);
  if(p.jbuf>0&&p.coy>0&&!p.blk&&p.hurt<.4){p.vy=DF[DIFF].vy;p.ground=false;p.coy=0;p.jbuf=0;p.jumped=true;dust(p.x+9,p.y+p.h,4);snd(380,.12,'triangle')}
  if(p.jumped&&!keys.up&&p.vy<-260){p.vy*=.5;p.jumped=false}
  if(p.vy>=0)p.jumped=false;
  if(pressed.atk&&p.atk<=0&&p.ground&&!p.blk){p.atk=.35;p.atkHit=false;snd(300,.08,'sawtooth')}
  pressed.atk=false;
  if(p.atk>0){p.atk-=dt;
    if(!p.atkHit&&p.atk<.2){p.atkHit=true;
      for(const g of guards){if(g.dead)continue;const dx=(g.x+g.w/2)-(p.x+p.w/2);
        if(Math.sign(dx)===p.dir&&Math.abs(dx)<58&&Math.abs(g.y-p.y)<40){
          sparks(g.x+9,g.y+16,10);
          if(g.stun<=0&&Math.random()<.3){g.vx=p.dir*90;snd(700,.08,'square')}
          else{g.hp--;g.hurt=.3;g.vx=p.dir*170;g.atk=0;shake=3;snd(220,.15,'sawtooth');if(g.hp<=0){g.dead=true}}}}}}
  p.vy=Math.min(p.vy+1800*dt,900);
  moveX(p,p.vx*dt);
  const vy0=p.vy,was=!p.ground;p.ground=false;moveY(p,p.vy*dt);
  if(p.ground){
    if(was){const d=p.y-p.peak;if(d>20)dust(p.x+9,p.y+p.h,Math.min(10,4+(d/16|0)));if(vy0>=895)die('נפלת מגובה רב מדי');else if(vy0>840){hurtPlayer(1,0);snd(100,.2,'square')}}
    else if(Math.abs(p.vx)>100&&Math.random()<.18)dust(p.x+9-p.dir*6,p.y+p.h,1);
    p.peak=p.y;
    const ty=Math.floor((p.y+p.h+2)/TS);
    for(let tx=Math.floor(p.x/TS);tx<=Math.floor((p.x+p.w-1)/TS);tx++)if(G[ty]&&G[ty][tx]==='L'){const k=tx+','+ty;if(loose[k]===undefined)loose[k]=0}
  }else{
    p.peak=Math.min(p.peak,p.y);
    if(p.grabCd<=0&&p.vy>-150&&(keys.up||(p.dir>0&&keys.right)||(p.dir<0&&keys.left)))tryGrab(p);
  }
  if(p.y>H*TS)die('נפלת לתהום');
  const cx=Math.floor((p.x+p.w/2)/TS),cy=Math.floor((p.y+p.h/2)/TS),fy=Math.floor((p.y+p.h-1)/TS);
  if(G[fy]&&G[fy][cx]==='P'&&!gateOpen){gateOpen=true;shake=4;snd(150,.5,'triangle',.07)}
  if(G[cy]&&G[cy][cx]==='H'){G[cy][cx]='.';if(p.hp>=p.maxhp&&p.maxhp<5)p.maxhp++;p.hp=Math.min(p.maxhp,p.hp+1);sparks(cx*TS+16,cy*TS+16,12);snd(800,.2,'triangle')}
  if(G[cy]&&G[cy][cx]==='E'){state='win';markDone();snd(900,.4,'triangle');if(lvl>=LEVELS.length-1)msg='ברחת מהארמון!'}
  for(let ty=Math.floor((p.y+p.h/2)/TS);ty<=fy;ty++)for(let tx=Math.floor((p.x+3)/TS);tx<=Math.floor((p.x+p.w-4)/TS);tx++){
    if(G[ty]&&G[ty][tx]==='^'&&p.y+p.h>ty*TS+TS*.5)die('הנסיך נפל על קוצים')}
}

function updGuard(g,dt){
  if(g.dead)return;
  g.hurt=Math.max(0,g.hurt-dt);g.stun=Math.max(0,g.stun-dt);g.cd=Math.max(0,g.cd-dt);
  const dx=(P.x+P.w/2)-(g.x+g.w/2),dy=P.y-g.y;
  const aware=!P.dead&&Math.abs(dy)<60&&Math.abs(dx)<280;
  let mv=0;
  if(g.atk>0){g.atk-=dt;if(!g.atkHit&&g.atk<.2){g.atkHit=true;
    if(Math.abs(dx)<56&&Math.abs(dy)<40&&Math.sign(dx)===g.dir){
      if(P.blk&&P.dir===-g.dir){g.stun=.7;g.vx=-g.dir*130;sparks((g.x+P.x)/2+9,g.y+14,12);shake=2;snd(650,.1,'square')}else hurtPlayer(1,g.dir)}}}
  else if(g.stun<=0&&aware&&g.hurt<=0){
    g.dir=dx>0?1:-1;
    if(Math.abs(dx)>46)mv=g.dir;
    else if(g.cd<=0){g.atk=.45;g.atkHit=false;g.cd=1.1+Math.random()*.6}
  }
  g.vx+=((mv*75)-g.vx)*Math.min(1,10*dt);
  if(mv&&g.ground){const nx=Math.floor((g.x+g.w/2+g.dir*(g.w/2+8))/TS),fy=Math.floor((g.y+g.h+4)/TS);if(!solid(nx,fy))g.vx=0}
  g.vy=Math.min(g.vy+1800*dt,900);moveX(g,g.vx*dt);g.ground=false;moveY(g,g.vy*dt);
  if(g.y>H*TS)g.dead=true;
}

function update(dt){
  tAnim+=dt;if(state==='story'&&story)story.t+=dt;gateA+=((gateOpen?1:0)-gateA)*Math.min(1,5*dt);fade=Math.max(0,fade-dt*1.6);shake=Math.max(0,shake-dt*20);
  if(state==='play'){
    timeLeft-=dt;if(timeLeft<=0){timeLeft=0;state='time'}
    updPlayer(dt);guards.forEach(g=>updGuard(g,dt));
    for(const k in loose){loose[k]+=dt;if(loose[k]>.6){const[x,y]=k.split(',').map(Number);G[y][x]='.';delete loose[k];debris.push({x:x*TS,y:y*TS,vy:0,r:0,vr:(Math.random()-.5)*4});dust(x*TS+16,y*TS+28,6);snd(90,.3,'square')}}
  }
  for(const d of debris){d.vy+=1500*dt;d.y+=d.vy*dt;d.r+=d.vr*dt}
  debris=debris.filter(d=>d.y<H*TS+80);
  for(const q of parts){q.life-=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
  parts=parts.filter(q=>q.life>0);
  if(state!=='title')for(const l of lights)if(l.t==='torch'&&Math.abs(l.x-P.x)<400&&Math.random()<dt*1.5)ember(l.x,l.y-6);
  const tx=Math.max(0,Math.min(W*TS-VW,P.x-VW/2)),ty=Math.max(0,Math.min(H*TS-VH,P.y-VH*.6));
  if(state==='play'||state==='dead'||state==='win'){cam.x+=(tx-cam.x)*Math.min(1,6*dt);cam.y+=(ty-cam.y)*Math.min(1,6*dt)}
}

/* ---------- textures ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkC(w,h){const c=document.createElement('canvas');c.width=w*SC;c.height=h*SC;const x=c.getContext('2d');x.scale(SC,SC);return[c,x]}
function stoneTex(seed,surf,lo){
  const[c,x]=mkC(TS,TS),r=rng(seed);
  const g=x.createLinearGradient(0,0,0,TS);
  if(lo){g.addColorStop(0,'#a58c68');g.addColorStop(1,'#7e6a4e')}else{g.addColorStop(0,'#947d5a');g.addColorStop(1,'#6e5a41')}
  x.fillStyle=g;x.fillRect(0,0,TS,TS);
  for(let i=0;i<110;i++){x.fillStyle=r()<.5?'rgba(255,235,190,'+(r()*.09)+')':'rgba(30,18,8,'+(r()*.14)+')';x.fillRect(r()*TS,r()*TS,1+r()*3,1+r()*2)}
  x.fillStyle='rgba(30,20,10,.6)';x.fillRect(0,TS-1.5,TS,1.5);x.fillRect(TS-1.5,0,1.5,TS);
  x.fillStyle='rgba(255,230,180,.18)';x.fillRect(0,0,TS,1.2);x.fillRect(0,0,1.2,TS);
  if(surf){const t=x.createLinearGradient(0,0,0,8);t.addColorStop(0,'#cdb27a');t.addColorStop(1,'rgba(205,178,122,0)');x.fillStyle=t;x.fillRect(0,0,TS,8);x.fillStyle='#e2c88f';x.fillRect(0,0,TS,1.6)}
  else{x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,TS,TS)}
  if(r()<.55){x.strokeStyle='rgba(25,15,8,.6)';x.lineWidth=.8;x.beginPath();let cx=r()*TS,cy=r()*8+4;x.moveTo(cx,cy);for(let k=0;k<4;k++){cx+=(r()-.5)*8;cy+=4+r()*4;x.lineTo(cx,cy)}x.stroke()}
  if(r()<.25){x.fillStyle='rgba(70,105,50,.35)';x.beginPath();x.ellipse(r()*TS,TS-2,6+r()*5,2.5,0,0,7);x.fill()}
  return c}
const TEX={};
function buildTex(){

}

  const sx=wx+14,sy=bot-62,sun=x.createRadialGradient(sx,sy,2,sx,sy,64);sun.addColorStop(0,'rgba(255,240,200,1)');sun.addColorStop(.2,'rgba(255,200,120,.9)');sun.addColorStop(1,'rgba(255,150,80,0)');x.fillStyle=sun;x.fillRect(wx-ww,top,ww*2,bot-top);
  x.fillStyle='#7a2c40';x.beginPath();x.moveTo(wx-ww,bot-34);for(let i=0;i<=ww*2;i+=8)x.lineTo(wx-ww+i,bot-38-Math.sin(i*.07)*10-Math.sin(i*.19)*3);x.lineTo(wx+ww,bot);x.lineTo(wx-ww,bot);x.fill();
  x.fillStyle='#34182a';x.beginPath();x.moveTo(wx-ww,bot-14);for(let i=0;i<=ww*2;i+=8)x.lineTo(wx-ww+i,bot-18-Math.sin(i*.05+2)*8);x.lineTo(wx+ww,bot);x.lineTo(wx-ww,bot);x.fill();

  x.fillStyle='#8f7a5a';x.fillRect(wx-ww-12,bot-2,ww*2+24,10);x.fillStyle='#5b4a36';x.fillRect(wx-ww-12,bot+8,ww*2+24,4);

  for(const cx of[26,358]){
    const g=x.createLinearGradient(cx-15,0,cx+15,0);g.addColorStop(0,'#3a2c1f');g.addColorStop(.35,'#9a8461');g.addColorStop(.7,'#6b5840');g.addColorStop(1,'#2b2016');
    x.fillStyle=g;x.fillRect(cx-13,0,26,384);

  const sh=x.createLinearGradient(0,0,0,384);sh.addColorStop(0,'rgba(0,0,0,.35)');sh.addColorStop(.5,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=sh;x.fillRect(0,0,384,384);

/* ---------- character drawing ---------- */
const PR={cloth:'#f3eddd',shade:'#cdc4aa',sash:'#2c6fe0',pants:'#e7e0cb',boot:'#5a3b24',skin:'#dba57c',hair:'#1f1410',head:'turban'};
const GD={cloth:'#b8292f',shade:'#7d1a20',sash:'#e3aa2f',pants:'#3a2a2a',boot:'#241a14',skin:'#c58f68',hair:'#0e0a08',head:'helmet'};
function pt(x,y,a,l){return[x+Math.sin(a)*l,y+Math.cos(a)*l]}
function limb(x0,y0,a1,l1,a2,l2,w,col){
  const[x1,y1]=pt(x0,y0,a1,l1),[x2,y2]=pt(x1,y1,a2,l2);
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#1a120d';ctx.lineWidth=w+1.8;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  return[x2,y2]}
function blade(x,y,a,len,glow){
  const[tx,ty]=pt(x,y,a,len),nx=Math.cos(a),ny=-Math.sin(a),cx=(x+tx)/2+nx*4*(Math.sin(a)>0?1:1),cy=(y+ty)/2+ny*4;
  ctx.lineCap='round';
  ctx.strokeStyle='#1a120d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(cx,cy,tx,ty);ctx.stroke();
  ctx.strokeStyle=glow?'#fff':'#dfe7ee';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(cx,cy,tx,ty);ctx.stroke();
  const[hx,hy]=pt(x,y,a+1.5708,4),[hx2,hy2]=pt(x,y,a-1.5708,4);
  ctx.strokeStyle='#e3b44a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx2,hy2);ctx.stroke()}
function pose(e,t,armed){
  const o={lean:0,bob:0,fl:[.12,.12],bl:[-.14,-.1],fa:[.25,.55],ba:[-.25,.45],sw:null,swA:0};
  const run=e.ground&&Math.abs(e.vx)>20;
  if(e.hang||e.climb>0){const k=e.climb>0?1-e.climb/.35:0;o.fl=[.15+Math.sin(t*2)*.05,.35];o.bl=[-.12,.25];o.fa=[Math.PI-.1,Math.PI-.05];o.ba=[Math.PI+.25,Math.PI+.1];o.hangP=true;if(k>0){o.fl=[.9,-.2];o.bl=[.4,.6];o.lean=.1}return o}
  if(e.dead)return o;
  if(e.atk>0){const total=armed==='g'?.45:.35,k=1-e.atk/total;o.lean=.12+k*.12;o.fl=[.55,.15];o.bl=[-.5,-.05];o.fa=[Math.PI*.9-k*Math.PI*.55,Math.PI*.9-k*Math.PI*.55];o.ba=[-.6,.2];o.sw=true;o.swA=o.fa[1]+.1;o.trail=k;return o}
  if(e.blk>0){o.lean=.05;o.fl=[.35,.1];o.bl=[-.35,0];o.fa=[Math.PI*.55,Math.PI*.9];o.ba=[-.4,.3];o.sw=true;o.swA=Math.PI*.98;return o}
  if(e.hurt>.3){o.lean=-.3;o.fa=[2.2,2.4];o.ba=[-2.2,-2.4];o.fl=[.3,.5];o.bl=[-.3,.5];return o}
  if(!e.ground){
    if(e.vy<0){o.fl=[1.1,-.5];o.bl=[-.3,.6];o.fa=[2.5,2.7];o.ba=[-2.3,-2.6];o.lean=.05}
    else{o.fl=[.5,.35];o.bl=[-.5,.25];o.fa=[2.6,2.8];o.ba=[-2.6,-2.8];o.lean=-.03}
    if(armed)o.sw=true,o.swA=Math.PI*.6;
    return o}
  if(run){const ph=t*(armed?9:13)+(e.x*.02);const s=Math.sin(ph),c=Math.cos(ph),s2=Math.sin(ph+Math.PI),c2=Math.cos(ph+Math.PI);
    o.fl=[s*.85,s*.85-Math.max(0,c)*1.0];o.bl=[s2*.85,s2*.85-Math.max(0,c2)*1.0];
    o.fa=[-s*.8+.2,-s*.8+1.0];o.ba=[s*.8-.2,s*.8+.7];o.lean=.12;o.bob=-Math.abs(Math.sin(ph))*1.6;
    if(armed){o.fa=[Math.PI*.5,Math.PI*.55];o.sw=true;o.swA=Math.PI*.55}
    return o}
  o.bob=Math.sin(t*2.2+e.x)*.5;
  if(armed){o.sw=true;o.fa=[Math.PI*.45,Math.PI*.5];o.swA=Math.PI*.48+Math.sin(t*3)*.04;o.fl=[.3,.1];o.bl=[-.3,-.05];o.lean=.04}
  return o}
function drawFig(e,st,armed,t){
  if(ART&&drawFigArt(e,st,armed,t))return;
  const o=pose(e,t,armed);
  const cx=e.x+e.w/2;
  ctx.save();
  let ox=0,oy=0;
  if(e.climb>0){const tg=climbTarget(e),k=1-e.climb/.35,ease=k*k*(3-2*k);ox=(tg.x-e.x)*ease;oy=(tg.y-e.y)*ease}
  if(e.dead){ctx.translate(cx,e.y+e.h);ctx.rotate(e.dir>0?-1.45:1.45);ctx.translate(0,-e.h/2)}
  else ctx.translate(cx+ox,e.y+oy);
  if(!e.dead&&e.ground){ctx.save();ctx.scale(1,.28);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.arc(0,(e.h)/.28,10,0,7);ctx.fill();ctx.restore()}
  if(e.hurt>0&&Math.floor(tAnim*30)%2)ctx.globalAlpha=.45;
  ctx.scale(e.dir,1);
  if(e.dead)ctx.translate(0,e.h/2-18);
  ctx.translate(0,o.bob);
  const hipX=0,hipY=25;
  // sash tail
  const sp=Math.max(-1,Math.min(1,-e.vx/150));
  ctx.strokeStyle='#1a120d';ctx.lineWidth=5.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-3,22);ctx.quadraticCurveTo(-9,25+Math.sin(t*6)*1.5,-12-sp*2,28+Math.sin(t*7)*3);ctx.stroke();
  ctx.strokeStyle=st.sash;ctx.lineWidth=3.4;ctx.beginPath();ctx.moveTo(-3,22);ctx.quadraticCurveTo(-9,25+Math.sin(t*6)*1.5,-12-sp*2,28+Math.sin(t*7)*3);ctx.stroke();
  // back leg
  limb(hipX,hipY,o.bl[0],8,o.bl[1],8,4.4,st.pants);
  ctx.fillStyle=st.boot;
  // upper body
  ctx.save();ctx.translate(0,hipY);ctx.rotate(o.lean);ctx.translate(0,-hipY);
  // back arm
  limb(0,13,o.ba[0],6.5,o.ba[1],6.5,3.6,st.shade);
  // torso
  ctx.beginPath();ctx.moveTo(-5.5,12);ctx.lineTo(5.5,12);ctx.lineTo(4.6,26);ctx.lineTo(-4.6,26);ctx.closePath();
  ctx.fillStyle=st.cloth;ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#1a120d';ctx.stroke();
  ctx.fillStyle=st.shade;ctx.fillRect(-5,15,2.4,10);
  if(st.head==='helmet'){ctx.fillStyle='#4a4f58';ctx.fillRect(-5,12,10,5);ctx.fillStyle='#6a707a';ctx.fillRect(-5,12,10,1.6)}
  ctx.fillStyle=st.sash;ctx.fillRect(-5,21,10,3.4);ctx.fillStyle='#ffffff30';ctx.fillRect(-5,21,10,1)
  // head
  ctx.fillStyle=st.skin;ctx.beginPath();ctx.arc(1,6.5,5,0,7);ctx.fill();ctx.lineWidth=1.3;ctx.stroke();
  ctx.fillStyle=st.hair;ctx.beginPath();ctx.arc(1,8.5,4.6,.2,3);ctx.fill();
  if(st.head==='turban'){
    ctx.fillStyle='#f6f2e6';ctx.beginPath();ctx.ellipse(0.5,2.2,6.4,4.2,-.1,0,7);ctx.fill();ctx.strokeStyle='#1a120d';ctx.lineWidth=1.2;ctx.stroke();
    ctx.strokeStyle='#cfc7b0';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(.5,2.5,4,3.3,5.8);ctx.stroke();
    ctx.fillStyle='#2c6fe0';ctx.beginPath();ctx.arc(4.6,1.5,1.5,0,7);ctx.fill();ctx.strokeStyle='#e3b44a';ctx.lineWidth=.8;ctx.stroke();
  }else{
    ctx.fillStyle='#8a909a';ctx.beginPath();ctx.moveTo(-5,5);ctx.quadraticCurveTo(1,-9,7,5);ctx.lineTo(7,3);ctx.quadraticCurveTo(1,-12,-5,3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8a909a';ctx.beginPath();ctx.ellipse(1,3,6.4,3.6,0,3.14,6.28);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#1a120d';ctx.stroke();
    ctx.fillStyle='#cfd3da';ctx.fillRect(0,-8,2,5);
  }
  ctx.fillStyle='#111';ctx.fillRect(3.4,6,1.3,1.6);
  // front arm & sword
  const hand=limb(0,13,o.fa[0],6.5,o.fa[1],6.5,3.8,st.skin);
  ctx.fillStyle=st.cloth;ctx.beginPath();ctx.arc(0,13,3.4,0,7);ctx.fill();
  if(o.sw){
    if(o.trail!==undefined){ctx.save();for(let i=1;i<=3;i++){ctx.globalAlpha=.28/i;ctx.strokeStyle='#fff';ctx.lineWidth=2.4;ctx.beginPath();const[tx,ty]=pt(hand[0],hand[1],o.swA+i*.28,26);ctx.moveTo(hand[0],hand[1]);ctx.lineTo(tx,ty);ctx.stroke()}ctx.restore()}
    blade(hand[0],hand[1],o.swA,26,o.trail!==undefined)}
  ctx.restore();
  // front leg
  const f=limb(hipX,hipY,o.fl[0],8,o.fl[1],8,4.8,st.pants);
  ctx.fillStyle=st.boot;ctx.strokeStyle='#1a120d';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(f[0]+1.5,f[1]+.4,3.6,2.2,0,0,7);ctx.fill();ctx.stroke();
  ctx.restore();
}

/* ---------- tile drawing ---------- */
function sol(x,y){if(x<0||x>=W||y<0)return true;if(y>=H)return false;const c=G[y][x];return c==='#'||c==='L'}
function drawTile(c,x,y){
  if(ART&&drawTileArt(c,x,y))return;
  const px=x*TS,py=y*TS,v=(x*7+y*13)&3;
  if(c==='#'||c==='L'){
    const lo=c==='L',surf=!sol(x,y-1);let ox=0;
    if(lo){const t=loose[x+','+y];if(t!==undefined)ox=Math.sin(tAnim*60)*1.6}
    ctx.drawImage(TEX[(lo?(surf?'ls':'li'):(surf?'s':'i'))+v],px+ox,py,TS,TS);
    if(!sol(x,y+1)){const g=ctx.createLinearGradient(0,py+TS,0,py+TS+12);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(px,py+TS,TS,12)}
    if(!sol(x-1,y)){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(px-3,py,3,TS)}
    if(!sol(x+1,y)){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(px+TS,py,3,TS)}
  }else if(c==='^'){
    for(let i=0;i<4;i++){const bx=px+i*8,g=ctx.createLinearGradient(bx,0,bx+8,0);g.addColorStop(0,'#f2f5f8');g.addColorStop(.5,'#b9c0c8');g.addColorStop(1,'#6d747d');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(bx,py+TS);ctx.lineTo(bx+4,py+TS*.38);ctx.lineTo(bx+8,py+TS);ctx.fill();ctx.strokeStyle='#1a120d';ctx.lineWidth=.8;ctx.stroke()}
    ctx.fillStyle='#3a3f46';ctx.fillRect(px,py+TS-3,TS,3);
  }else if(c==='G'){
    if(!gateOpen){
      const g=ctx.createLinearGradient(px,0,px+TS,0);g.addColorStop(0,'#2d3238');g.addColorStop(.5,'#8a929c');g.addColorStop(1,'#2d3238');
      for(let i=0;i<4;i++){ctx.fillStyle=g;ctx.fillRect(px+3+i*8,py,5,TS);}
      ctx.fillStyle='#4a525b';ctx.fillRect(px,py+TS/2-2,TS,4);ctx.fillStyle='#b39a5a';for(let i=0;i<4;i++)ctx.fillRect(px+4.5+i*8,py+TS/2-1,2,2);
      if(!(G[y+1]&&G[y+1][x]==='G')){ctx.fillStyle='#c5ccd4';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(px+3+i*8,py+TS);ctx.lineTo(px+5.5+i*8,py+TS+7);ctx.lineTo(px+8+i*8,py+TS);ctx.fill()}}
    }else if(G[y-1]&&G[y-1][x]!=='G'){ctx.fillStyle='#6a727c';for(let i=0;i<4;i++)ctx.fillRect(px+3+i*8,py,5,6);ctx.fillStyle='#2d3238';ctx.fillRect(px,py,TS,2)}
  }else if(c==='P'){
    const pr=gateOpen?2:5;ctx.fillStyle='#3a2a18';ctx.fillRect(px+2,py+TS-pr-1,TS-4,pr+1);
    const g=ctx.createLinearGradient(0,py+TS-pr,0,py+TS);g.addColorStop(0,'#f0c75e');g.addColorStop(1,'#a67c1d');ctx.fillStyle=g;ctx.fillRect(px+4,py+TS-pr,TS-8,pr);
    if(!gateOpen){ctx.fillStyle='rgba(255,210,100,'+(.2+.15*Math.sin(tAnim*4))+')';ctx.beginPath();ctx.ellipse(px+16,py+TS-3,14,6,0,0,7);ctx.fill()}
  }else if(c==='H'){
    const b=Math.sin(tAnim*3+x)*2,gx=px+16,gy=py+20+b;
    const gl=ctx.createRadialGradient(gx,gy,1,gx,gy,22);gl.addColorStop(0,'rgba(255,70,70,.55)');gl.addColorStop(1,'rgba(255,70,70,0)');ctx.fillStyle=gl;ctx.fillRect(gx-22,gy-22,44,44);
    ctx.fillStyle='#8f1d1d';ctx.beginPath();ctx.arc(gx,gy+1,8,0,7);ctx.fill();ctx.strokeStyle='#1a120d';ctx.lineWidth=1.2;ctx.stroke();
    const g=ctx.createRadialGradient(gx-3,gy-2,1,gx,gy,8);g.addColorStop(0,'#ff8a8a');g.addColorStop(1,'#d12b2b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(gx,gy+1,7,0,7);ctx.fill();
    ctx.fillStyle='#d9d4c4';ctx.fillRect(gx-3,gy-12,6,6);ctx.strokeRect(gx-3,gy-12,6,6);ctx.fillStyle='#8a5a2a';ctx.fillRect(gx-3.5,gy-14,7,3);
  }else if(c==='E'){
    const top=py-TS;
    ctx.fillStyle='#7e6a4c';ctx.fillRect(px-2,top-4,TS+4,TS*2+4);
    ctx.beginPath();ctx.arc(px+16,top+4,18,Math.PI,0);ctx.fill();
    const g=ctx.createLinearGradient(0,top,0,py+TS);g.addColorStop(0,'#ffe9a8');g.addColorStop(.5,'#ffb457');g.addColorStop(1,'#a3411f');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(px+3,py+TS);ctx.lineTo(px+3,top+6);ctx.arc(px+16,top+6,13,Math.PI,0);ctx.lineTo(px+29,py+TS);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,'+(.25+.15*Math.sin(tAnim*4))+')';ctx.fillRect(px+10,top+10,12,TS*2-14);
    ctx.strokeStyle='#1a120d';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(px+3,py+TS);ctx.lineTo(px+3,top+6);ctx.arc(px+16,top+6,13,Math.PI,0);ctx.lineTo(px+29,py+TS);ctx.stroke();
    ctx.fillStyle='#a58d68';for(let i=0;i<3;i++)ctx.fillRect(px+2-i*2,py+TS-3-i*0,TS-4+i*4,3);
  }else if(c==='T'){
    ctx.fillStyle='#2a1c10';ctx.fillRect(px+13,py+8,6,16);ctx.fillStyle='#6a5030';ctx.fillRect(px+11,py+6,10,4);ctx.fillRect(px+14,py+22,4,3);
    const f=Math.sin(tAnim*13+x*3),f2=Math.sin(tAnim*9+x);
    ctx.fillStyle='#d9551a';ctx.beginPath();ctx.moveTo(px+11,py+6);ctx.quadraticCurveTo(px+9+f,py-6,px+16+f2*1.5,py-12-f2*2);ctx.quadraticCurveTo(px+23-f,py-6,px+21,py+6);ctx.fill();
    ctx.fillStyle='#ff9d2e';ctx.beginPath();ctx.moveTo(px+13,py+6);ctx.quadraticCurveTo(px+12,py-3,px+16+f2,py-8);ctx.quadraticCurveTo(px+20,py-3,px+19,py+6);ctx.fill();
    ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.ellipse(px+16,py+3,2.4,4.5,0,0,7);ctx.fill();
  }
}

/* ---------- screen drawing ---------- */
function drawBG(){
  if(ART){
    const T=(CUR&&CUR.th)||{zoom:1.3,by:.35,bgx:0},h=Math.round(VH*T.zoom),w=Math.round(h*BGI.width/BGI.height),px=cam.x*.3+T.bgx;
    const oy=-Math.round((h-VH)*T.by+Math.min(cam.y*.15,(h-VH)*(1-T.by)));
    for(let i=-1;i<=2;i++){const n=Math.floor(px/w)+i,dx=n*w-px;if(dx>VW||dx+w<0)continue;
      ctx.save();if(n&1){ctx.translate(dx+w,0);ctx.scale(-1,1);ctx.drawImage(BGI,0,oy,w,h)}else ctx.drawImage(BGI,dx,oy,w,h);ctx.restore()}
    return}
  const ox=Math.floor(-((cam.x*.5)%384)),oy=Math.floor(-((cam.y*.4)%384));
  for(let x=ox;x<VW;x+=384)for(let y=oy;y<VH;y+=384)ctx.drawImage(TEX.bg,x,y,384,384);
}
let lc=null,lx=null;
function drawLight(){
  if(!lc){lc=document.createElement('canvas');lc.width=VW*SC;lc.height=VH*SC;lx=lc.getContext('2d')}
  lx.setTransform(1,0,0,1,0,0);lx.globalCompositeOperation='source-over';lx.clearRect(0,0,lc.width,lc.height);
  lx.fillStyle='rgba(8,4,10,'+(ART?((CUR&&CUR.th&&CUR.th.dark)||.5):.66)+')';lx.fillRect(0,0,lc.width,lc.height);
  lx.globalCompositeOperation='destination-out';lx.setTransform(SC,0,0,SC,0,0);
  const add=(x,y,r,a)=>{const g=lx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(.55,'rgba(0,0,0,'+a*.55+')');g.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g;lx.fillRect(x-r,y-r,r*2,r*2)};
  for(const l of lights){const sx=l.x-cam.x,sy=l.y-cam.y;if(sx<-200||sx>VW+200||sy<-200||sy>VH+200)continue;add(sx,sy,l.r+(l.t==='torch'?Math.sin(tAnim*11+l.x)*6:0),l.a)}
  if(P)add(P.x+9-cam.x,P.y+14-cam.y,120,.55);
  ctx.drawImage(lc,0,0,VW,VH);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const l of lights){const sx=l.x-cam.x,sy=l.y-cam.y;if(sx<-200||sx>VW+200||sy<-200||sy>VH+200)continue;
    const r=l.r*.7,g=ctx.createRadialGradient(sx,sy,0,sx,sy,r);g.addColorStop(0,l.t==='torch'?'rgba(255,150,60,.34)':'rgba(255,220,140,.3)');g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.fillRect(sx-r,sy-r,r*2,r*2)}
  ctx.restore();
  const v=ctx.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VW*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,VW,VH);
}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s}
const FONT="'Heebo','Rubik','Segoe UI',system-ui,Arial,sans-serif";
function txt(t,x,y,size,col,w,al,sh){ctx.font=(w||'700')+' '+size+'px '+FONT;ctx.textAlign=al||'center';if(sh){ctx.lineWidth=sh;ctx.strokeStyle='rgba(10,5,2,.9)';ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y)}
function heart(x,y,full,col,dim){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-9,-3,-4,-9,0,-3);ctx.bezierCurveTo(4,-9,9,-3,0,4);ctx.closePath();ctx.fillStyle=full?col:dim;ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#150c08';ctx.stroke();if(full){ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(-3,-3,1.6,1,-.6,0,7);ctx.fill()}ctx.restore()}
function panel(x,y,w,h){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#2b1a10');g.addColorStop(1,'#140b07');ctx.fillStyle=g;ctx.strokeStyle='#d9a84a';ctx.lineWidth=1.6;ctx.beginPath();ctx.roundRect(x,y,w,h,7);ctx.fill();ctx.stroke();ctx.strokeStyle='#d9a84a55';ctx.lineWidth=.8;ctx.beginPath();ctx.roundRect(x+3,y+3,w-6,h-6,5);ctx.stroke()}
function gold(y,size){const g=ctx.createLinearGradient(0,y-size,0,y+size*.3);g.addColorStop(0,'#fff0b8');g.addColorStop(.5,'#ffc857');g.addColorStop(1,'#b8761c');return g}
function drawTitle(){
  cam.x=(tAnim*18)%768;cam.y=0;drawBG();
  const sky=ctx.createLinearGradient(0,VH*.4,0,VH);sky.addColorStop(0,'rgba(120,40,40,0)');sky.addColorStop(1,'rgba(20,8,6,.85)');ctx.fillStyle=sky;ctx.fillRect(0,0,VW,VH);

  if(MUS.run)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    MUS.bus=AC.createGain();MUS.bus.gain.value=0;
    const comp=AC.createDynamicsCompressor();MUS.bus.connect(comp);comp.connect(AC.destination);
    MUS.fx=AC.createGain();MUS.fx.connect(MUS.bus);
    const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.28;fb.gain.value=.34;wet.gain.value=.4;
    MUS.fx.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(MUS.bus);
    const d1=AC.createOscillator(),d2=AC.createOscillator(),dg=AC.createGain();d1.type='sine';d2.type='sine';dg.gain.value=.05;

  MUS.cfgKey=key;MUS.cfg=c;const r=rng(c.seed*977+13);MUS.motifs=[genPhrase(r),genPhrase(r)];MUS.step=0;MUS.bar=0;

  }
  panel(150,58,VW-300,214);
  {let fs=26;ctx.font='900 '+fs+'px '+FONT;while(ctx.measureText(pg.t).width>VW-340&&fs>16){fs--;ctx.font='900 '+fs+'px '+FONT}txt(pg.t,VW/2,104,fs,gold(104,fs),'900','center',5)}
  let n=Math.floor(story.t*40);
  for(let i=0;i<pg.l.length;i++){
    const ln=pg.l[i],part=ln.slice(0,Math.max(0,n));n-=ln.length;
    if(part)txt(part,VW-170,150+i*30,16.5,'#f3e3c0','500','right',3)
  }
  const a=.55+.45*Math.sin(tAnim*3.2);ctx.globalAlpha=a;txt('לחץ Enter או גע במסך להמשך',VW/2,338,16,'#fff','700','center',4);ctx.globalAlpha=1;
  drawMusicBtn(VW-34,10);
}
function touchNav(k){
  musicStart();
  if(state==='menu'){
    const n=LEVELS.length;
    if(k==='left')sel=(sel+1)%n;else if(k==='right')sel=(sel+n-1)%n;else if(k==='up')sel=(sel+n-4)%n;else if(k==='down')sel=(sel+4)%n;else openStory(sel);
  }else startOrRestart();
}
function menuKey(e){
  musicStart();
  const k=e.key;
  if(k==='m'||k==='M'){musicToggle();return true}
  if(k==='Escape'){
    if(state==='menu'){state='title';fade=1;return true}
    if(state!=='title'){state='menu';fade=1;return true}
    return false}
  if(state==='menu'){
    const n=LEVELS.length;
    if(k==='ArrowLeft'||k==='a'||k==='A')sel=(sel+1)%n;
    else if(k==='ArrowRight'||k==='d'||k==='D')sel=(sel+n-1)%n;
    else if(k==='ArrowUp'||k==='w'||k==='W')sel=(sel+n-4)%n;
    else if(k==='ArrowDown'||k==='s'||k==='S')sel=(sel+4)%n;
    else if(k==='1'||k==='2'||k==='3')setDiff(+k-1);
    else if(k==='Enter'||k===' ')openStory(sel);
    else return false;
    e.preventDefault();return true}
  return false}

/* ---------- input ---------- */
const KM={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down',z:'atk',j:'atk',x:'blk',k:'blk'};
addEventListener('keydown',e=>{
  const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];
  if(menuKey(e))return;
  if(e.key==='Enter'&&state!=='play')startOrRestart();
  if((e.key==='r'||e.key==='R')&&(state==='play'||state==='dead'))loadLevel(lvl);
  if(k){if(!keys[k])pressed[k]=true;keys[k]=true;e.preventDefault();if(state==='title')startOrRestart()}
});
addEventListener('keyup',e=>{const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(k)keys[k]=false});
cv.addEventListener('pointerdown',e=>{
  musicStart();const[x,y]=ptr(e);
  if(state==='play'){if(y>34&&y<60){if(x>8&&x<36)musicToggle();else if(x>38&&x<66){state='menu';fade=1}}return}
  if(state==='menu'){if(x>VW-36&&y<34){musicToggle();return}for(let k=0;k<3;k++){const[bx,by]=diffPos(k);if(x>=bx&&x<=bx+84&&y>=by&&y<=by+24){setDiff(k);return}}const i=menuHit(x,y);if(i>=0){sel=i;openStory(i)}return}
  startOrRestart()});
document.querySelectorAll('.b').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play'){touchNav(k);return}if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on')});
  const up=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
buildTex();
loadLevel(0);state='title';fade=0;
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(!ART&&!artFail){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0a0605';ctx.fillRect(0,0,cv.width,cv.height);requestAnimationFrame(frame);return}
  musicTick();update(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
