<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#120a08">
<meta property="og:title" content="נסיך המדבר">
<meta property="og:description" content="משחק פלטפורמה אקרובטי בדפדפן. 3 מפלסים, שומרים, מלכודות וקרב חרבות.">
<title>נסיך המדבר</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23240f10'/%3E%3Cpath d='M16 5l3 8h8l-6.5 5 2.5 8-7-5-7 5 2.5-8L5 13h8z' fill='%23ffc857'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#0a0605;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Heebo','Rubik','Segoe UI',system-ui,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a150c,#0a0605 70%)}
canvas{background:#000;box-shadow:0 0 60px #000a,0 0 0 2px #3a2a1a}
#touch{position:fixed;bottom:10px;left:0;right:0;display:none;justify-content:space-between;padding:0 12px;pointer-events:none;direction:ltr}
#touch .g{display:flex;gap:10px;pointer-events:auto}
.b{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff40,#ffffff14);border:2px solid #ffd98a88;color:#ffe9b8;font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.b.on{background:#ffd98a77}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
 <div class="g"><div class="b" data-k="left">◀</div><div class="b" data-k="right">▶</div></div>
 <div class="g"><div class="b" data-k="blk">🛡</div><div class="b" data-k="atk">⚔</div><div class="b" data-k="up">▲</div><div class="b" data-k="down">▼</div></div>
</div>
<script>
const TS=32,VW=640,VH=360,SC=2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW*SC;cv.height=VH*SC;
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=VW*s+'px';cv.style.height=VH*s+'px'}
addEventListener('resize',fit);fit();

/* ---------- sound ---------- */
let AC=null;
function snd(f,d,t,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

/* ---------- levels ---------- */
function mk(w,h){const g=[];for(let y=0;y<h;y++)g.push(Array(w).fill('.'));return g}
function R(g,y,x1,x2,c){for(let x=x1;x<=x2;x++)g[y][x]=c}
function base(w,h){const g=mk(w,h);R(g,0,0,w-1,'#');for(let y=0;y<h;y++){g[y][0]='#';g[y][w-1]='#'}for(let y=11;y<h;y++)R(g,y,0,w-1,'#');return g}
function pit(g,x1,x2,spikesRow){R(g,11,x1,x2,'.');R(g,12,x1,x2,'.');if(spikesRow===12)R(g,12,x1,x2,'^');else R(g,13,x1,x2,'^')}
function gate(g,x){for(let y=4;y<=10;y++)g[y][x]='G'}
function torches(g,xs,y){xs.forEach(x=>{if(g[y][x]==='.')g[y][x]='T'})}

const LEVELS=[
 {name:'מפלס 1: חצר הארמון',start:[2,10],guards:[[70,10,2]],build(){
  const w=80,g=base(w,14);
  pit(g,14,16,12);
  R(g,8,22,26,'#');g[7][24]='H';
  R(g,5,31,35,'#');g[4][33]='H';
  R(g,10,40,42,'^');
  R(g,11,48,50,'L');
  g[10][58]='P';gate(g,66);
  g[10][77]='E';
  torches(g,[6,20,38,55,62,75],6);
  return g}},
 {name:'מפלס 2: מרתפי הארמון',start:[2,10],guards:[[55,10,2],[90,10,3]],build(){
  const w=100,g=base(w,14);
  pit(g,12,14,12);
  R(g,8,20,24,'#');
  R(g,5,28,31,'#');g[4][29]='H';
  R(g,8,36,40,'#');g[7][38]='H';
  R(g,10,45,47,'^');
  pit(g,62,66,13);R(g,11,62,66,'L');
  R(g,9,68,69,'#');R(g,7,70,76,'#');g[6][75]='P';
  gate(g,82);
  g[10][96]='E';
  torches(g,[5,18,33,50,60,80,88],6);
  return g}},
 {name:'מפלס 3: מגדל הוזיר',start:[2,10],guards:[[60,10,3],[80,10,3],[100,10,4]],build(){
  const w=120,g=base(w,14);
  R(g,10,12,14,'^');
  pit(g,20,22,12);
  R(g,9,30,32,'#');R(g,6,34,38,'#');R(g,3,42,46,'#');g[2][44]='H';
  R(g,6,50,54,'L');R(g,10,50,54,'^');
  g[10][70]='P';gate(g,74);
  pit(g,86,92,13);R(g,11,86,92,'L');
  g[10][115]='E';
  torches(g,[6,18,28,48,58,68,78,95,105],6);
  return g}}
];

/* ---------- state ---------- */
let state='title',lvl=0,G,W,H,gateOpen,loose,debris,guards,P,timeLeft=1200,msg='',cam={x:0,y:0},tAnim=0,lights=[],parts=[],shake=0,fade=0;
const keys={},pressed={};

function solid(tx,ty){if(tx<0||tx>=W)return true;if(ty<0)return true;if(ty>=H)return false;const c=G[ty][tx];return c==='#'||c==='L'||(c==='G'&&!gateOpen)}
function ent(x,y,hp){return{x:x*TS+7,y:y*TS-8,w:18,h:40,vx:0,vy:0,dir:1,ground:false,hp:hp,maxhp:hp,atk:0,atkHit:false,blk:0,stun:0,hurt:0,cd:0.8,dead:false,peak:y*TS,hang:false,climb:0,grabCd:0}}
function loadLevel(n){
  const L=LEVELS[n];G=L.build();H=G.length;W=G[0].length;gateOpen=false;loose={};debris=[];parts=[];shake=0;fade=1;
  P=ent(L.start[0],L.start[1],3);P.hp=3;P.maxhp=3;
  guards=L.guards.map(a=>{const g=ent(a[0],a[1],a[2]);g.dir=-1;return g});
  lights=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=G[y][x];if(c==='T')lights.push({x:x*TS+16,y:y*TS+6,r:150,a:.95,t:'torch'});if(c==='E')lights.push({x:x*TS+16,y:y*TS-8,r:130,a:.9,t:'door'})}
  cam.x=Math.max(0,P.x-VW/2);cam.y=Math.max(0,Math.min(H*TS-VH,P.y-VH*.6));
  state='play';msg='';
}
function startOrRestart(){
  if(state==='title'||state==='end'||state==='time'){lvl=0;timeLeft=1200;loadLevel(0)}
  else if(state==='dead'){loadLevel(lvl)}
  else if(state==='win'){lvl++;if(lvl>=LEVELS.length)state='end';else loadLevel(lvl)}
}

/* ---------- particles ---------- */
function dust(x,y,n,col){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*10,y:y,vx:(Math.random()-.5)*60,vy:-Math.random()*30,life:.5,max:.5,s:2+Math.random()*3,col:col||'200,180,140',g:-20,k:'dust'})}
function sparks(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*140;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.35,max:.35,s:1.5,col:'255,230,150',g:400,k:'spark'})}}
function ember(x,y){parts.push({x:x+(Math.random()-.5)*6,y:y,vx:(Math.random()-.5)*14,vy:-20-Math.random()*20,life:1.2,max:1.2,s:1.4,col:'255,160,60',g:-6,k:'spark'})}

/* ---------- physics ---------- */
function moveX(e,dx){e.x+=dx;const t0=Math.floor(e.y/TS),t1=Math.floor((e.y+e.h-1)/TS);
  if(dx>0){const tx=Math.floor((e.x+e.w)/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=tx*TS-e.w-0.01;e.vx=0;return}}
  else if(dx<0){const tx=Math.floor(e.x/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=(tx+1)*TS+0.01;e.vx=0;return}}}
function moveY(e,dy){e.y+=dy;const t0=Math.floor(e.x/TS),t1=Math.floor((e.x+e.w-1)/TS);
  if(dy>0){const ty=Math.floor((e.y+e.h)/TS);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=ty*TS-e.h-0.01;e.vy=0;e.ground=true;return}}
  else if(dy<0){const ty=Math.floor(e.y/TS);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=(ty+1)*TS+0.01;e.vy=0;return}}}

function die(why){if(P.dead)return;P.dead=true;P.hp=0;msg=why;state='dead';shake=8;snd(120,.6,'sawtooth',.08)}
function hurtPlayer(n,fromDir){if(P.hurt>0||P.dead)return;P.hp-=n;P.hurt=.7;P.vx=fromDir*200;P.vy=-150;P.hang=false;P.atk=0;shake=6;sparks(P.x+9,P.y+16,6);snd(180,.2,'sawtooth');if(P.hp<=0)die('הנסיך נפל בקרב')}

function tryGrab(p){
  const hx=p.x+(p.dir>0?p.w+3:-3),hy=p.y+4,tx=Math.floor(hx/TS),ty=Math.floor(hy/TS);
  if(solid(tx,ty)&&!solid(tx,ty-1)&&(hy-ty*TS)<14){
    p.hang=true;p.vx=p.vy=0;p.gx=tx;p.gy=ty;
    p.x=p.dir>0?tx*TS-p.w-1:(tx+1)*TS+1;p.y=ty*TS+2;
  }
}
function canClimb(p){return !solid(p.gx,p.gy-1)&&!solid(p.gx,p.gy-2)}
function climbTarget(p){return{x:p.dir>0?p.gx*TS+3:(p.gx+1)*TS-p.w-3,y:p.gy*TS-p.h-0.01}}
function finishClimb(p){const t=climbTarget(p);p.x=t.x;p.y=t.y;p.hang=false;p.vy=0;p.peak=p.y;p.grabCd=.2}

function updPlayer(dt){
  const p=P;if(p.dead)return;
  p.hurt=Math.max(0,p.hurt-dt);p.grabCd=Math.max(0,p.grabCd-dt);
  if(p.climb>0){p.climb-=dt;if(p.climb<=0){p.climb=0;finishClimb(p)}return}
  if(p.hang){
    if(keys.down){p.hang=false;p.grabCd=.35;p.vy=0}
    else if((keys.up||pressed.up)&&canClimb(p))p.climb=.35;
    pressed.up=false;return}
  p.blk=(keys.blk&&p.ground&&p.atk<=0)?1:0;
  let ax=0;if(keys.left)ax-=1;if(keys.right)ax+=1;
  const sp=(p.blk||p.atk>0)?35:150;
  if(p.hurt<.4){p.vx+=((ax*sp)-p.vx)*Math.min(1,(p.ground?14:5)*dt);if(ax&&!p.blk&&p.atk<=0)p.dir=ax}
  if(pressed.up&&p.ground&&!p.blk&&p.hurt<.4){p.vy=-520;p.ground=false;dust(p.x+9,p.y+p.h,4);snd(380,.12,'triangle')}
  pressed.up=false;
  if(pressed.atk&&p.atk<=0&&p.ground&&!p.blk){p.atk=.35;p.atkHit=false;snd(300,.08,'sawtooth')}
  pressed.atk=false;
  if(p.atk>0){p.atk-=dt;
    if(!p.atkHit&&p.atk<.2){p.atkHit=true;
      for(const g of guards){if(g.dead)continue;const dx=(g.x+g.w/2)-(p.x+p.w/2);
        if(Math.sign(dx)===p.dir&&Math.abs(dx)<58&&Math.abs(g.y-p.y)<40){
          sparks(g.x+9,g.y+16,10);
          if(g.stun<=0&&Math.random()<.3){g.vx=p.dir*90;snd(700,.08,'square')}
          else{g.hp--;g.hurt=.3;g.vx=p.dir*170;g.atk=0;shake=3;snd(220,.15,'sawtooth');if(g.hp<=0){g.dead=true}}}}}}
  p.vy=Math.min(p.vy+1800*dt,900);
  moveX(p,p.vx*dt);
  const was=!p.ground;p.ground=false;moveY(p,p.vy*dt);
  if(p.ground){
    if(was){const d=p.y-p.peak;if(d>20)dust(p.x+9,p.y+p.h,Math.min(10,4+(d/16|0)));if(d>TS*7)die('נפלת מגובה רב מדי');else if(d>TS*3.6){hurtPlayer(1,0);snd(100,.2,'square')}}
    else if(Math.abs(p.vx)>100&&Math.random()<.18)dust(p.x+9-p.dir*6,p.y+p.h,1);
    p.peak=p.y;
    const ty=Math.floor((p.y+p.h+2)/TS);
    for(let tx=Math.floor(p.x/TS);tx<=Math.floor((p.x+p.w-1)/TS);tx++)if(G[ty]&&G[ty][tx]==='L'){const k=tx+','+ty;if(loose[k]===undefined)loose[k]=0}
  }else{
    p.peak=Math.min(p.peak,p.y);
    if(p.grabCd<=0&&p.vy>-150&&(keys.up||(p.dir>0&&keys.right)||(p.dir<0&&keys.left)))tryGrab(p);
  }
  if(p.y>H*TS)die('נפלת לתהום');
  const cx=Math.floor((p.x+p.w/2)/TS),cy=Math.floor((p.y+p.h/2)/TS),fy=Math.floor((p.y+p.h-1)/TS);
  if(G[fy]&&G[fy][cx]==='P'&&!gateOpen){gateOpen=true;shake=4;snd(150,.5,'triangle',.07)}
  if(G[cy]&&G[cy][cx]==='H'){G[cy][cx]='.';if(p.hp>=p.maxhp&&p.maxhp<5)p.maxhp++;p.hp=Math.min(p.maxhp,p.hp+1);sparks(cx*TS+16,cy*TS+16,12);snd(800,.2,'triangle')}
  if(G[cy]&&G[cy][cx]==='E'){state='win';snd(900,.4,'triangle');if(lvl>=LEVELS.length-1)msg='ברחת מהארמון!'}
  for(let ty=Math.floor((p.y+p.h/2)/TS);ty<=fy;ty++)for(let tx=Math.floor((p.x+3)/TS);tx<=Math.floor((p.x+p.w-4)/TS);tx++){
    if(G[ty]&&G[ty][tx]==='^'&&p.y+p.h>ty*TS+TS*.5)die('הנסיך נפל על קוצים')}
}

function updGuard(g,dt){
  if(g.dead)return;
  g.hurt=Math.max(0,g.hurt-dt);g.stun=Math.max(0,g.stun-dt);g.cd=Math.max(0,g.cd-dt);
  const dx=(P.x+P.w/2)-(g.x+g.w/2),dy=P.y-g.y;
  const aware=!P.dead&&Math.abs(dy)<60&&Math.abs(dx)<280;
  let mv=0;
  if(g.atk>0){g.atk-=dt;if(!g.atkHit&&g.atk<.2){g.atkHit=true;
    if(Math.abs(dx)<56&&Math.abs(dy)<40&&Math.sign(dx)===g.dir){
      if(P.blk&&P.dir===-g.dir){g.stun=.7;g.vx=-g.dir*130;sparks((g.x+P.x)/2+9,g.y+14,12);shake=2;snd(650,.1,'square')}else hurtPlayer(1,g.dir)}}}
  else if(g.stun<=0&&aware&&g.hurt<=0){
    g.dir=dx>0?1:-1;
    if(Math.abs(dx)>46)mv=g.dir;
    else if(g.cd<=0){g.atk=.45;g.atkHit=false;g.cd=1.1+Math.random()*.6}
  }
  g.vx+=((mv*75)-g.vx)*Math.min(1,10*dt);
  if(mv&&g.ground){const nx=Math.floor((g.x+g.w/2+g.dir*(g.w/2+8))/TS),fy=Math.floor((g.y+g.h+4)/TS);if(!solid(nx,fy))g.vx=0}
  g.vy=Math.min(g.vy+1800*dt,900);moveX(g,g.vx*dt);g.ground=false;moveY(g,g.vy*dt);
  if(g.y>H*TS)g.dead=true;
}

function update(dt){
  tAnim+=dt;fade=Math.max(0,fade-dt*1.6);shake=Math.max(0,shake-dt*20);
  if(state==='play'){
    timeLeft-=dt;if(timeLeft<=0){timeLeft=0;state='time'}
    updPlayer(dt);guards.forEach(g=>updGuard(g,dt));
    for(const k in loose){loose[k]+=dt;if(loose[k]>.6){const[x,y]=k.split(',').map(Number);G[y][x]='.';delete loose[k];debris.push({x:x*TS,y:y*TS,vy:0,r:0,vr:(Math.random()-.5)*4});dust(x*TS+16,y*TS+28,6);snd(90,.3,'square')}}
  }
  for(const d of debris){d.vy+=1500*dt;d.y+=d.vy*dt;d.r+=d.vr*dt}
  debris=debris.filter(d=>d.y<H*TS+80);
  for(const q of parts){q.life-=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
  parts=parts.filter(q=>q.life>0);
  if(state!=='title')for(const l of lights)if(l.t==='torch'&&Math.abs(l.x-P.x)<400&&Math.random()<dt*1.5)ember(l.x,l.y-6);
  const tx=Math.max(0,Math.min(W*TS-VW,P.x-VW/2)),ty=Math.max(0,Math.min(H*TS-VH,P.y-VH*.6));
  if(state==='play'||state==='dead'||state==='win'){cam.x+=(tx-cam.x)*Math.min(1,6*dt);cam.y+=(ty-cam.y)*Math.min(1,6*dt)}
}

/* ---------- textures ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkC(w,h){const c=document.createElement('canvas');c.width=w*SC;c.height=h*SC;const x=c.getContext('2d');x.scale(SC,SC);return[c,x]}
function stoneTex(seed,surf,lo){
  const[c,x]=mkC(TS,TS),r=rng(seed);
  const g=x.createLinearGradient(0,0,0,TS);
  if(lo){g.addColorStop(0,'#a58c68');g.addColorStop(1,'#7e6a4e')}else{g.addColorStop(0,'#947d5a');g.addColorStop(1,'#6e5a41')}
  x.fillStyle=g;x.fillRect(0,0,TS,TS);
  for(let i=0;i<110;i++){x.fillStyle=r()<.5?'rgba(255,235,190,'+(r()*.09)+')':'rgba(30,18,8,'+(r()*.14)+')';x.fillRect(r()*TS,r()*TS,1+r()*3,1+r()*2)}
  x.fillStyle='rgba(30,20,10,.6)';x.fillRect(0,TS-1.5,TS,1.5);x.fillRect(TS-1.5,0,1.5,TS);
  x.fillStyle='rgba(255,230,180,.18)';x.fillRect(0,0,TS,1.2);x.fillRect(0,0,1.2,TS);
  if(surf){const t=x.createLinearGradient(0,0,0,8);t.addColorStop(0,'#cdb27a');t.addColorStop(1,'rgba(205,178,122,0)');x.fillStyle=t;x.fillRect(0,0,TS,8);x.fillStyle='#e2c88f';x.fillRect(0,0,TS,1.6)}
  else{x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,TS,TS)}
  if(r()<.55){x.strokeStyle='rgba(25,15,8,.6)';x.lineWidth=.8;x.beginPath();let cx=r()*TS,cy=r()*8+4;x.moveTo(cx,cy);for(let k=0;k<4;k++){cx+=(r()-.5)*8;cy+=4+r()*4;x.lineTo(cx,cy)}x.stroke()}
  if(r()<.25){x.fillStyle='rgba(70,105,50,.35)';x.beginPath();x.ellipse(r()*TS,TS-2,6+r()*5,2.5,0,0,7);x.fill()}
  return c}
const TEX={};
function buildTex(){
  for(let i=0;i<4;i++){TEX['s'+i]=stoneTex(11+i,true,false);TEX['i'+i]=stoneTex(31+i,false,false);TEX['ls'+i]=stoneTex(51+i,true,true);TEX['li'+i]=stoneTex(71+i,false,true)}
  TEX.bg=bgTex();
}
function bgTex(){
  const[c,x]=mkC(384,384),r=rng(7);
  x.fillStyle='#2a1e16';x.fillRect(0,0,384,384);
  for(let by=0;by<384;by+=16)for(let bx=-((by/16)%2)*16;bx<384;bx+=32){const s=r();x.fillStyle='rgb('+(40+s*16|0)+','+(29+s*11|0)+','+(21+s*9|0)+')';x.fillRect(bx+1,by+1,30,14);x.fillStyle='rgba(255,220,170,.05)';x.fillRect(bx+1,by+1,30,2)}
  const wx=192,ww=62,top=62,bot=292;
  x.save();x.beginPath();x.moveTo(wx-ww,bot);x.lineTo(wx-ww,top+ww);x.arc(wx,top+ww,ww,Math.PI,0);x.lineTo(wx+ww,bot);x.closePath();x.clip();
  const sg=x.createLinearGradient(0,top,0,bot);sg.addColorStop(0,'#1c1238');sg.addColorStop(.35,'#6a2a55');sg.addColorStop(.62,'#d9534a');sg.addColorStop(.82,'#f59a52');sg.addColorStop(1,'#ffd48c');
  x.fillStyle=sg;x.fillRect(0,top-10,384,bot-top+10);

    const r=l.r*.7,g=ctx.createRadialGradient(sx,sy,0,sx,sy,r);g.addColorStop(0,l.t==='torch'?'rgba(255,150,60,.34)':'rgba(255,220,140,.3)');g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.fillRect(sx-r,sy-r,r*2,r*2)}
  ctx.restore();
  const v=ctx.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VW*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,VW,VH);
}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s}
const FONT="'Heebo','Rubik','Segoe UI',system-ui,Arial,sans-serif";
function txt(t,x,y,size,col,w,al,sh){ctx.font=(w||'700')+' '+size+'px '+FONT;ctx.textAlign=al||'center';if(sh){ctx.lineWidth=sh;ctx.strokeStyle='rgba(10,5,2,.9)';ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y)}
function heart(x,y,full,col,dim){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-9,-3,-4,-9,0,-3);ctx.bezierCurveTo(4,-9,9,-3,0,4);ctx.closePath();ctx.fillStyle=full?col:dim;ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#150c08';ctx.stroke();if(full){ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(-3,-3,1.6,1,-.6,0,7);ctx.fill()}ctx.restore()}
function panel(x,y,w,h){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#2b1a10');g.addColorStop(1,'#140b07');ctx.fillStyle=g;ctx.strokeStyle='#d9a84a';ctx.lineWidth=1.6;ctx.beginPath();ctx.roundRect(x,y,w,h,7);ctx.fill();ctx.stroke();ctx.strokeStyle='#d9a84a55';ctx.lineWidth=.8;ctx.beginPath();ctx.roundRect(x+3,y+3,w-6,h-6,5);ctx.stroke()}
function gold(y,size){const g=ctx.createLinearGradient(0,y-size,0,y+size*.3);g.addColorStop(0,'#fff0b8');g.addColorStop(.5,'#ffc857');g.addColorStop(1,'#b8761c');return g}
function drawTitle(){
  cam.x=(tAnim*18)%768;cam.y=0;drawBG();
  const sky=ctx.createLinearGradient(0,VH*.4,0,VH);sky.addColorStop(0,'rgba(120,40,40,0)');sky.addColorStop(1,'rgba(20,8,6,.85)');ctx.fillStyle=sky;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#1a0f0a';ctx.fillRect(0,300,VW,60);ctx.fillStyle='#4a3826';ctx.fillRect(0,300,VW,3);
  // hero and guard standing
  ctx.save();ctx.translate(150,260);ctx.scale(1.7,1.7);drawFig({x:-9,y:0,w:18,h:40,vx:0,vy:0,dir:1,ground:true,hurt:0,atk:0,blk:0,dead:false,hang:false,climb:0},PR,true,tAnim);ctx.restore();
  ctx.save();ctx.translate(490,260);ctx.scale(1.7,1.7);drawFig({x:-9,y:0,w:18,h:40,vx:0,vy:0,dir:-1,ground:true,hurt:0,atk:0,blk:0,dead:false,hang:false,climb:0},GD,true,tAnim+1.3);ctx.restore();
  txt('נסיך המדבר',VW/2+2,112,64,'#000',900,'center',0);
  ctx.font='900 64px '+FONT;ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#2a140a';ctx.lineJoin='round';ctx.strokeText('נסיך המדבר',VW/2,108);ctx.fillStyle=gold(108,64);ctx.fillText('נסיך המדבר',VW/2,108);
  ctx.strokeStyle='#d9a84a';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(190,128);ctx.lineTo(300,128);ctx.moveTo(340,128);ctx.lineTo(450,128);ctx.stroke();
  ctx.fillStyle='#ffc857';ctx.beginPath();ctx.moveTo(320,121);ctx.lineTo(326,128);ctx.lineTo(320,135);ctx.lineTo(314,128);ctx.fill();
  txt('הברח מהארמון לפני שהשמש שוקעת',VW/2,160,17,'#f3e3c0','500','center',3);
  txt('חצים או WASD: ריצה וקפיצה     Z: חרב     X: הגנה     S: שחרור מתלייה',VW/2,222,13,'#d8c7a0','500','center',3);
  const a=.55+.45*Math.sin(tAnim*3.2);ctx.globalAlpha=a;txt('לחץ Enter או גע במסך כדי להתחיל',VW/2,340,19,'#fff','700','center',4);ctx.globalAlpha=1;
}
function overlay(title,sub,col){ctx.fillStyle='rgba(6,3,2,.72)';ctx.fillRect(0,0,VW,VH);panel(VW/2-190,VH/2-62,380,124);txt(title,VW/2,VH/2-8,34,col,'900','center',4);txt(sub,VW/2,VH/2+32,15,'#e8d9b8','500','center',3)}
function draw(){
  ctx.setTransform(SC,0,0,SC,0,0);ctx.globalAlpha=1;
  if(state==='title'){drawTitle();return}
  drawBG();
  ctx.save();
  const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;
  ctx.translate(-Math.round(cam.x)+sx,-Math.round(cam.y)+sy);
  const x0=Math.floor(cam.x/TS)-1,x1=Math.ceil((cam.x+VW)/TS)+1,y0=Math.floor(cam.y/TS)-1,y1=Math.ceil((cam.y+VH)/TS)+2;
  for(let y=Math.max(0,y0);y<Math.min(H,y1);y++)for(let x=Math.max(0,x0);x<Math.min(W,x1);x++){const c=G[y][x];if(c==='T'||c==='E')drawTile(c,x,y)}
  for(let y=Math.max(0,y0);y<Math.min(H,y1);y++)for(let x=Math.max(0,x0);x<Math.min(W,x1);x++){const c=G[y][x];if(c!=='.'&&c!=='T'&&c!=='E')drawTile(c,x,y)}
  for(const d of debris){ctx.save();ctx.translate(d.x+16,d.y+16);ctx.rotate(d.r);ctx.drawImage(TEX.li0,-16,-16,TS,TS);ctx.restore()}
  guards.forEach(g=>drawFig(g,GD,true,tAnim));
  drawFig(P,PR,P.atk>0||P.blk>0,tAnim);
  for(const q of parts){const k=Math.max(0,q.life/q.max);ctx.fillStyle='rgba('+q.col+','+(q.k==='dust'?k*.5:k)+')';ctx.beginPath();ctx.arc(q.x,q.y,q.s*(q.k==='dust'?(1.6-k*.6):1),0,7);ctx.fill()}
  ctx.restore();
  drawLight();
  // HUD
  ctx.fillStyle='rgba(10,5,3,.55)';ctx.beginPath();ctx.roundRect(8,8,P.maxhp*20+10,22,6);ctx.fill();
  for(let i=0;i<P.maxhp;i++)heart(22+i*20,19,i<P.hp,'#ef3b3b','#3a1616');
  const near=guards.find(g=>!g.dead&&Math.abs(g.x-P.x)<300&&Math.abs(g.y-P.y)<80);
  if(near){const w=near.maxhp*20+10;ctx.fillStyle='rgba(10,5,3,.55)';ctx.beginPath();ctx.roundRect(VW-8-w,8,w,22,6);ctx.fill();for(let i=0;i<near.maxhp;i++)heart(VW-22-i*20,19,i<near.hp,'#e8a23a','#3a2a16')}
  ctx.fillStyle='rgba(10,5,3,.6)';ctx.beginPath();ctx.roundRect(VW/2-44,6,88,40,8);ctx.fill();ctx.strokeStyle='#d9a84a99';ctx.lineWidth=1;ctx.stroke();
  txt(fmt(timeLeft),VW/2,27,19,timeLeft<180?'#ff6a6a':'#fff','800','center',0);txt(LEVELS[lvl].name,VW/2,41,9.5,'#d8c7a0','500','center',0);
  if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,VW,VH)}
  if(state==='dead')overlay(msg||'הנסיך נפל','Enter או נגיעה לניסיון נוסף','#ff6b6b');
  if(state==='time')overlay('הזמן נגמר','Enter להתחלה מחדש','#ff6b6b');
  if(state==='win')overlay(lvl>=LEVELS.length-1?'ברחת מהארמון!':'המפלס הושלם','Enter להמשך','#ffd36b');
  if(state==='end')overlay('ניצחת!','נשאר לך '+fmt(timeLeft)+'   Enter למשחק חדש','#ffd36b');
}

/* ---------- input ---------- */
const KM={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down',z:'atk',j:'atk',x:'blk',k:'blk'};
addEventListener('keydown',e=>{
  const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];
  if(e.key==='Enter'&&state!=='play')startOrRestart();
  if((e.key==='r'||e.key==='R')&&(state==='play'||state==='dead'))loadLevel(lvl);
  if(k){if(!keys[k])pressed[k]=true;keys[k]=true;e.preventDefault();if(state==='title')startOrRestart()}
});
addEventListener('keyup',e=>{const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(k)keys[k]=false});
cv.addEventListener('pointerdown',()=>{if(state!=='play')startOrRestart()});
document.querySelectorAll('.b').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play'){startOrRestart();return}if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on')});
  const up=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
buildTex();
loadLevel(0);state='title';fade=0;
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
